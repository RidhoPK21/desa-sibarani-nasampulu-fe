name: Test Kegiatan Desa Component

on:
  push:
    paths:
      - "src/pages/Kegiatan.jsx"
      - "src/__tests__/test-KegiatanDesa.test.jsx"
  pull_request:
    paths:
      - "src/pages/Kegiatan.jsx"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test